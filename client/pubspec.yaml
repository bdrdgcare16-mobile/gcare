name: serv_app
description: "A new Flutter project."
publish_to: "none"

version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & System packages
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.0
  table_calendar: ^3.0.9
  image_picker: ^1.0.4
  image_picker_web: ^4.0.0
  file_picker: ^10.2.0
  open_filex: ^4.7.0

  # --- FlutterFire ---
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_auth: ^6.0.0

  # Align with local_auth_ios constraints
  intl: ^0.18.1

  google_maps_flutter: ^2.13.1
  intl_phone_field: ^3.2.0
  permission_handler: ^12.0.1
  universal_io: ^2.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  http: ^1.4.0
  geolocator: ^14.0.2
  url_launcher: ^6.2.1
  google_fonts: ^6.2.1


  # Camera & ML Kit
  camera: ^0.11.2
  google_ml_kit: ^0.20.0
  google_mlkit_commons: ^0.11.0
  google_mlkit_entity_extraction: ^0.15.1
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_smart_reply: ^0.13.0

  # Storage/paths/JWT
  path_provider: ^2.0.12
  path: ^1.8.0
  jwt_decoder: ^2.0.1
  gal: ^2.3.2

  # Preferences & file generation
  shared_preferences: ^2.5.3
  shared_preferences_web: ^2.3.0
  excel: ^4.0.6
  pdfx: ^2.9.2
  file_saver: ^0.3.1

  # Biometric auth (keep only the umbrella package)
  local_auth: ^2.2.0
  local_auth_ios: ^1.1.7
  google_maps_flutter_web: ^0.5.14+2

  # ✅ ADDED
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_28pt-Italic.ttf
          style: italic
